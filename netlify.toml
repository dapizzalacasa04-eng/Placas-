# Netlify Configuration for GoldFlow NFC (Vite React SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Regras de reescrita SPA para QR Codes e NFC
[[redirects]]
  from = "/q/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/qr/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200

# Catch-all SPA rewrite rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
