# Netlify Configuration for GoldFlow NFC (Vite React SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) rewrite rule
# Ensures dynamic QR Code routes (/q/:slug, /r/:slug, etc.) resolve to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
