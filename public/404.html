<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoldFlow NFC — Redirecionando...</title>
    <style>
      body {
        margin: 0;
        background: #060b17;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function() {
        try {
          var path = window.location.pathname;
          var search = window.location.search;
          var hash = window.location.hash;

          // Check if this is a QR (/q/) or NFC (/r/) short link
          var match = path.match(/^\/?(?:q|qr|r)\/([^\/?#]+)/i);
          if (match) {
            // Forward to root with the full route parameter for seamless SPA recovery
            var redirectUrl = '/?p=' + encodeURIComponent(path) + (search ? '&' + search.slice(1) : '') + hash;
            window.location.replace(redirectUrl);
            return;
          }

          // General SPA recovery
          var fallbackUrl = '/?p=' + encodeURIComponent(path) + (search ? '&' + search.slice(1) : '') + hash;
          window.location.replace(fallbackUrl);
        } catch (e) {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body>
    <div>
      <div class="spinner"></div>
      <p style="font-size: 14px; color: #94a3b8;">Carregando GoldFlow NFC...</p>
    </div>
  </body>
</html>
